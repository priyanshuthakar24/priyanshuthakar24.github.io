<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name – DevOps Engineer</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#000;--muted:#5c5c5c;--line:#d9d9d9;--soft:#f4f4f4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#fff;--muted:#a3a3a3;--line:#2e2e2e;--soft:#111;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--ink:#fff;--muted:#a3a3a3;--line:#2e2e2e;--soft:#111;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:6rem}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.7 "Hanken Grotesk",system-ui,sans-serif}
h1,h2,h3{font-family:"Newsreader",Georgia,serif;font-weight:500;margin:0;line-height:1.15}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:66rem;margin:0 auto;padding:0 1.5rem}
header.bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + .9rem) 1rem 0;pointer-events:none;transition:transform .45s cubic-bezier(.3,.8,.3,1)}
header.bar.hide{transform:translateY(-130%)}
.pill{pointer-events:auto;display:flex;align-items:center;gap:.4rem;padding:.35rem .4rem .35rem 1.2rem;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--bg) 75%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);position:relative}
.brand{font:500 1.15rem "Newsreader",Georgia,serif;text-decoration:none;margin-right:1.2rem;white-space:nowrap}
#nav{position:relative;display:flex;gap:.1rem}
#nav a{position:relative;z-index:1;text-decoration:none;color:var(--muted);font-size:.92rem;padding:.4rem .85rem;border-radius:999px;white-space:nowrap;transition:color .25s}
#nav a:hover{color:var(--ink)}
#nav a.on,#nav a.on:hover{color:var(--bg)}
#ind{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--ink);border-radius:999px;opacity:0;transition:transform .45s cubic-bezier(.3,.8,.3,1),width .45s cubic-bezier(.3,.8,.3,1),opacity .3s}
#theme,#menu{background:none;border:1px solid var(--line);color:var(--ink);border-radius:50%;width:2.3rem;height:2.3rem;cursor:pointer;display:grid;place-items:center;flex:none}
#menu{display:none}
#theme svg,#menu svg{width:1.05rem;height:1.05rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
#prog{position:fixed;top:0;left:0;height:2px;width:100%;background:var(--ink);transform-origin:0 50%;transform:scaleX(0);z-index:11}
.w{display:inline-block;animation:up .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(.55em)}to{opacity:1;transform:none}}
.js-on .rv{opacity:0;transform:translateY(28px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}
.js-on .rv.in{opacity:1;transform:none}
.js-on .card.rv.in:hover{transform:translateY(-3px);transition-duration:.2s}
.photo{will-change:transform}
.hi{font:italic 400 1.5rem "Newsreader",Georgia,serif;color:var(--muted);margin-bottom:.9rem}
.facts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.5rem}
.facts span{border:1px solid var(--line);border-radius:999px;padding:.25rem .9rem;font-size:.92rem;background:color-mix(in srgb,var(--bg) 70%,transparent)}
[hidden]{display:none!important}
button.cta{background:none;color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
.cta{margin-top:.5rem}
button.dlcv{background:none;border:0;border-bottom:1px solid var(--ink);color:var(--ink);font:inherit;padding:0;cursor:pointer}
::selection{background:var(--ink);color:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(color-mix(in srgb,var(--ink) 40%,transparent) 1px,transparent 1.3px);background-size:26px 26px;-webkit-mask-image:radial-gradient(circle 340px at var(--mx,50%) var(--my,22%),#000 0%,rgba(0,0,0,.1) 100%);mask-image:radial-gradient(circle 340px at var(--mx,50%) var(--my,22%),#000 0%,rgba(0,0,0,.1) 100%)}
main{position:relative;z-index:1}
.card,.sk{position:relative;overflow:hidden;background:color-mix(in srgb,var(--bg) 70%,transparent)}
.card::after,.sk::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(280px circle at var(--x,50%) var(--y,0%),color-mix(in srgb,var(--ink) 11%,transparent),transparent 70%)}
.card:hover::after,.sk:hover::after{opacity:1}
.marq{overflow:hidden;border-top:1px solid var(--line);padding:1.6rem 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.track{display:flex;width:max-content;animation:mq 50s linear infinite}
.marq:hover .track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mi{display:inline-flex;align-items:center;gap:.6rem;padding:0 1.8rem;font:500 1.35rem "Newsreader",Georgia,serif;color:var(--muted);white-space:nowrap;transition:color .25s}
.mi:hover{color:var(--ink)}
.mi svg{width:1.5rem;height:1.5rem;fill:currentColor}
.tl{position:relative;padding-left:2.2rem}
.tl::before,.tl::after{content:"";position:absolute;left:0;top:.4rem;width:2px}
.tl::before{bottom:.4rem;background:var(--line)}
.tl::after{height:calc(var(--p,0)*(100% - .8rem));background:var(--ink)}
.tl .item{position:relative}
.tl .item::before{content:"";position:absolute;left:-2.2rem;top:.55rem;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ink);transform:translateX(-5px)}
.co{font-weight:600;font-size:1.05rem;margin-top:.25rem}
.co::before{content:"";display:inline-block;width:.45rem;height:.45rem;background:var(--ink);border-radius:50%;margin-right:.55rem;vertical-align:middle}
section{padding:4rem 0;border-top:1px solid var(--line)}
section#home{border-top:0;padding:8rem 0 4rem;display:grid;grid-template-columns:1fr 17rem;gap:3.5rem;align-items:center}
h1{font-size:clamp(2.5rem,6vw,4.3rem);letter-spacing:-.02em;max-width:15ch}
.lead{font-size:1.2rem;color:var(--muted);max-width:36rem;margin:1.4rem 0 1.8rem}
.cta{display:inline-block;padding:.65rem 1.3rem;border:1px solid var(--ink);border-radius:999px;text-decoration:none;font-weight:500}
.cta.fill{background:var(--ink);color:var(--bg)}
.cta+.cta{margin-left:.6rem}
.photo{aspect-ratio:3/4;border-radius:999px 999px 1rem 1rem;overflow:hidden;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center}
.photo img{width:100%;height:100%;object-fit:cover}
.photo span{font:500 4rem "Newsreader",Georgia,serif;color:var(--muted)}
h2{font-size:clamp(2rem,5vw,3rem);letter-spacing:-.02em;margin-bottom:2.2rem}
p{margin:0 0 1rem;max-width:40rem}
.meta{color:var(--muted);font-size:.95rem;margin:.2rem 0 .6rem}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1.25rem}
.sk{border:1px solid var(--line);border-radius:12px;padding:1.2rem}
.sk h3{font-size:1.2rem;margin-bottom:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem .2rem .45rem;font-size:.88rem;line-height:1.5}
.chip svg{width:1rem;height:1rem;fill:currentColor;flex:none}
.chip i{font:600 .62rem/1 "Hanken Grotesk",sans-serif;font-style:normal;width:1rem;height:1rem;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center}
.item{padding:0 0 1.75rem;max-width:42rem}
.item h3{font-size:1.3rem}
ul.pts{margin:0;padding-left:1.1rem}
ul.pts li{margin-bottom:.3rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(19rem,1fr));gap:1.25rem}
.card{border:1px solid var(--line);border-radius:14px;padding:1.5rem;display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--ink);transform:translateY(-3px)}
.card h3{font-size:1.35rem;margin-bottom:.6rem}
.card p{color:var(--muted);margin:0 0 .8rem}
.card .res{color:var(--ink);font-weight:500;font-size:.95rem}
.card .chips{margin:auto 0 1rem;padding-top:.6rem}
.card a{font-weight:500}
.row{display:flex;justify-content:space-between;gap:1rem;padding:.8rem 0;border-bottom:1px solid var(--line);max-width:42rem}
.row:first-of-type{border-top:1px solid var(--line)}
.row span:last-child{color:var(--muted);white-space:nowrap}
.links{display:flex;gap:1.5rem;flex-wrap:wrap}
footer{color:var(--muted);font-size:.9rem;padding:2rem 0 3rem;border-top:1px solid var(--line)}
@media (max-width:820px){
section#home{grid-template-columns:1fr;gap:2rem;padding-top:2.5rem}
.photo{order:-1;width:10rem}
.pill{width:100%;max-width:28rem}.brand{margin-right:auto}
#menu{display:grid}#ind{display:none}
#nav{display:none;position:absolute;top:calc(100% + .5rem);left:0;right:0;flex-direction:column;gap:0;background:var(--bg);border:1px solid var(--line);border-radius:1.25rem;padding:.5rem}
header.bar.open #nav{display:flex}
#nav a{padding:.7rem 1rem;font-size:1rem}
#nav a.on,#nav a.on:hover{color:var(--ink);font-weight:600}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.w{animation:none}.track{animation:none}.js-on .rv{opacity:1;transform:none;transition:none}.card{transition:none}.card:hover{transform:none}}
</style>
</head>

<button id="menu" type="button" aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg></button>
</div></header>
<main class="wrap" id="main"></main>
